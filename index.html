<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS HW 2</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="card">
        <span class="badge">Save: 1,000৳</span>

        <div class="img-box">
            <img src="monitor.webp" alt="GEESUU Monitor">
        </div>

        <h3 class="product-title">
            <a href="#">GEESUU BAFANG M215LF2 21.5" 100Hz FHD IPS Monitor</a>
        </h3>

        <ul class="features">
            <li>Resolution: FHD (1920 x 1080)</li>
            <li>Display: 21.5 Inch IPS, 100Hz</li>
            <li>Ports: 1x HDMI 1x VGA</li>
            <li>Features: Low Blue Light, VESA Mount</li>
        </ul>

        <div class="price">
            <span class="current-price">7,999৳</span>
            <span class="old-price">8,999৳</span>
        </div>

        <button class="buy-btn">Buy Now</button>

        <div class="compare">
            <img src="icon.png" alt="Compare Icon"> Add to Compare
        </div>
    </div>

</body>
</html>
